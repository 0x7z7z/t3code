name: Clean up relay preview

# Tears down stage `pr-<n>` when `relay:preview` is removed or the PR closes,
# and sweeps stages left behind by a failed teardown.
#
# This runs under pull_request_target, so the workflow and the Alchemy program
# come from the default branch. No PR code runs here, which is why it needs no
# reviewer approval and why a PR cannot edit its own teardown to reach secrets.
on:
  pull_request_target:
    types: [unlabeled, closed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: relay-preview-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  cleanup_pr:
    name: Tear down relay preview
    if: >-
      github.event_name == 'pull_request_target' &&
      (
        (github.event.action == 'unlabeled' && github.event.label.name == 'relay:preview') ||
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'relay:preview'))
      )
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    environment:
      name: relay-preview-cleanup
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: "false"
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      # Destroy also runs the preview tunnel sweep, which is part of the stack.
      - name: Destroy preview stage
        run: vp run --filter t3code-relay destroy --stage "$STAGE" --yes --no-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  sweep_orphans:
    name: Sweep orphaned relay previews
    if: github.event_name != 'pull_request_target'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    environment:
      name: relay-preview-cleanup
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: "false"
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Destroy stages of closed labeled PRs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # A failed listing must fail the step, not look like an empty sweep.
          limit=1000
          numbers=$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed \
            --label "relay:preview" --limit "$limit" --json number --jq '.[].number') \
            || { echo "Could not list closed relay:preview PRs" >&2; exit 1; }
          # gh silently truncates at --limit, which would skip the oldest stages.
          if [ "$(printf '%s\n' "$numbers" | grep -c .)" -ge "$limit" ]; then
            echo "Reached the $limit-PR listing limit; paginate before trusting this sweep" >&2
            exit 1
          fi
          failed=0
          for number in $numbers; do
            stage="pr-$number"
            echo "::group::$stage"
            vp run --filter t3code-relay destroy --stage "$stage" --yes --no-input \
              || { echo "Cleanup failed for $stage" >&2; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
